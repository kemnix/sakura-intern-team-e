services:
  # 単一オリジンの入口（本番の AppRun 構成と同じ経路）
  # ブラウザは http://<ホスト> にアクセスし、/api だけ api へ転送される
  # 外部に公開するのはこの 80 番だけ（api / db / frontend はすべて内部のみ）
  proxy:
    image: ${REGISTRY_HOST:-<作成したコンテナレジストリのホスト名>}/sakuravel-proxy:latest
    platform: linux/amd64
    ports:
      # ホスト側で 80 が埋まっている場合は PROXY_HOST_PORT で退避できる。
      # 例: PROXY_HOST_PORT=8000 docker compose -f compose.reg.yml up -d
      - "${PROXY_HOST_PORT:-80}:8081"
    environment:
      # nginx の upstream に入れる server 行（本番はノードIPを列挙、ローカルはサービス名1台）
      - API_UPSTREAM_SERVERS=server api:8080;
      - FRONT_UPSTREAM_SERVERS=server frontend:3000;
    depends_on:
      - api
      - frontend
    restart: on-failure

  api:
    image: ${REGISTRY_HOST:-<作成したコンテナレジストリのホスト名>}/sakuravel-backend:latest
    platform: linux/amd64
    environment:
      - DATABASE_URL=sakuravel:password@tcp(db:3306)/sakuravel?parseTime=true&charset=utf8mb4
      - PORT=8080
      # コード側の既定値と同じ。ここに書いておかないとコンテナに届かず、
      # デプロイ環境からプールを調整できない。
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-10}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-5}
      # 通知バス。未設定ならコード側の既定値が使われる。
      - NOTIFY_POLL_INTERVAL_MS
      - NOTIFY_POLL_BATCH
      - NOTIFY_GC_INTERVAL_SEC
      - NOTIFY_GC_BATCH
      - NOTIFY_RETENTION_SEC
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: sakuravel
      MYSQL_USER: sakuravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    # ホストへは非公開（CLI で入る場合: docker compose exec db mysql -usakuravel -ppassword sakuravel）
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d/
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u sakuravel -ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: ${REGISTRY_HOST:-<作成したコンテナレジストリのホスト名>}/sakuravel-frontend:latest
    platform: linux/amd64
    # 公開は proxy 経由のみ（ports なし）。
    # 注意: API_URL=/api のため、3000 直アクセスでは /api が解決できず動かない。
    environment:
      - API_URL=/api
    depends_on:
      - api
    restart: on-failure

volumes:
  mariadb_data:

networks:
  default:
    name: app-network
